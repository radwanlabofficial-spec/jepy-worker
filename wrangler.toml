name = "jepy-worker"
main = "src/index.ts"
# Pinned to a date the local workerd runtime already supports. The runtime's
# compatibility-date list lags the calendar, so "today" is rejected as being in
# the future; move this forward only when the runtime catches up.
compatibility_date = "2026-08-01"
workers_dev = true

# D1 migrations live in ./migrations and are forward-only.
#   local:  wrangler d1 migrations apply jepy-leads --local
#   remote: wrangler d1 migrations apply jepy-leads --remote
# Once --remote has run, migrations/0001_init.sql is never edited again
# (ADR-028); every further change is a new numbered file plus an ADR.
[[d1_databases]]
binding = "DB"
database_name = "jepy-leads"
database_id = "0c391e50-e258-4c62-a7d2-a246269d8940"

# The RouterDO binding. One instance per target_type, addressed by that key from
# the dispatcher — src/do/RouterDO.ts explains why it is a Durable Object at all.
[[durable_objects.bindings]]
name = "ROUTER_DO"
class_name = "RouterDO"

# `new_sqlite_classes`, not `new_classes`. A Durable Object created without SQLite
# storage does not run on the Workers free tier, and that failure surfaces at
# request time as "the Durable Object is not available" — which reads like a bug
# in the router rather than a choice made in a config file (R17).
#
# The tag stays v1: this is the first migration this Worker has ever declared, and
# renumbering it later would ask Cloudflare to re-apply it.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RouterDO"]

# KV and R2 are still to come: the cache and the raw-body store arrive with the
# adapters' storage step. They are deliberately absent rather than placeholdered —
# a binding that points nowhere fails at request time, not at deploy time.

# TWO triggers carry NINE jobs (11-api-contract.md §11 lists the jobs, not the
# triggers). Cloudflare caps the number of cron triggers per Worker, so one
# fast trigger runs the dispatcher and one hourly trigger decides which of the
# remaining eight are due — by reading the UTC hour and weekday itself.
# The handler in src/jobs/scheduled.ts holds that mapping.
#
# Consequence worth knowing: the jobs documented at 00:05, 03:00, 04:00 run on
# the hour instead, and a failed hourly tick delays them by up to an hour. Both
# are visible in cron_runs, and any job can be run on demand with
# POST /api/admin/run-cron when waiting is not acceptable.
[triggers]
crons = [
  "*/2 * * * *",  # dispatcher — claims due jobs every two minutes
  "0 * * * *",    # hourly tick — budget guard always, plus whatever is due
]

[vars]
ENVIRONMENT = "production"
# Cloudflare Access: the Zero Trust team domain and this application's aud.
# Both are non-secret by nature — they travel in every login URL — and the
# Worker needs them to verify the assertion header.
ACCESS_TEAM_DOMAIN = "hidden-mouse-a469.cloudflareaccess.com"
ACCESS_AUD = "a24977c8380f68525efe2696528c94e8114f4b7a71a6936f7e172331c263616a"
# Only consulted if a browser calls the API cross-origin; the console normally
# goes through the same-origin Pages proxy and never needs this.
CONSOLE_ORIGIN = "https://jepy-dashboard.pages.dev"
